<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamNode-01 · test console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#080d18;
  --panel:#0f1626;
  --panel2:#141d31;
  --line:#1e2a45;
  --lineHi:#2c3d61;
  --text:#ccd6e8;
  --dim:#5f7093;
  --amber:#f5a524;
  --teal:#2dd4bf;
  --red:#f0575f;
  --green:#66d97a;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --cond:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 70% -10%, #101c33 0%, transparent 60%),
    var(--void);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
}
.lbl{
  font-family:var(--cond);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  color:var(--dim);
}

.shell{
  display:grid;
  grid-template-rows:auto 1fr auto;
  height:100%;
  gap:1px;
  background:var(--line);
}
.bar,.log{background:var(--panel)}
.body{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:1px;
  background:var(--line);
  min-height:0;
}

.bar{
  display:flex;
  align-items:center;
  gap:20px;
  padding:11px 18px;
  flex-wrap:wrap;
}
.brand{
  font-family:var(--cond);
  font-weight:700;
  font-size:15px;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.brand span{color:var(--amber)}
.ribbon{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1;
  min-width:260px;
}
.state{
  font-family:var(--cond);
  font-weight:700;
  font-size:13px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--green);
  white-space:nowrap;
}
.gauge{
  position:relative;
  flex:1;
  height:6px;
  min-width:80px;
  background:var(--panel2);
  overflow:hidden;
}
.gauge i{
  position:absolute;
  inset:0 100% 0 0;
  background:linear-gradient(90deg,var(--green),var(--amber));
  transition:right .5s cubic-bezier(.2,.8,.3,1);
}
.draw{color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:14px;margin-left:auto}
.dot{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot b{
  width:7px;height:7px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 3px rgba(240,87,95,.15);
}
.dot.on b{background:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.15)}

.stage{
  background:var(--void);
  display:grid;
  grid-template-rows:1fr auto;
  min-height:0;
}
.screen{
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px),
    #05080f;
}
.screen img{max-width:100%;max-height:100%;display:block}
.screen.idle img{display:none}
.void{display:none;text-align:center;color:var(--dim);padding:24px}
.screen.idle .void{display:block}
.void b{
  display:block;
  font-family:var(--cond);
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--text);
  margin-bottom:6px;
}
.strip{
  display:flex;
  gap:26px;
  padding:9px 18px;
  border-top:1px solid var(--line);
  background:var(--panel);
  flex-wrap:wrap;
}
.stat b{
  display:block;
  font-size:15px;
  font-weight:600;
  color:var(--teal);
  font-variant-numeric:tabular-nums;
  line-height:1.3;
}

.side{
  background:var(--panel);
  overflow-y:auto;
  min-height:0;
}
.sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.sec > .lbl{display:block;margin-bottom:10px}

.row{display:flex;gap:8px}
button{
  flex:1;
  font-family:var(--cond);
  font-weight:600;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--lineHi);
  padding:9px 10px;
  cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
}
button:hover:not(:disabled){background:#1b2540;border-color:var(--amber);color:var(--amber)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button.go{border-color:#2a4a3a;color:var(--green)}
button.go:hover:not(:disabled){border-color:var(--green);color:var(--green);background:#132218}
button.halt{border-color:#4a2a2e;color:var(--red)}
button.halt:hover:not(:disabled){border-color:var(--red);color:var(--red);background:#221316}

.pad{
  position:relative;
  width:100%;
  aspect-ratio:1;
  background:var(--panel2);
  border:1px solid var(--line);
  cursor:crosshair;
  touch-action:none;
}
.pad:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pad svg{position:absolute;inset:0;width:100%;height:100%}
.axes{stroke:var(--line);stroke-width:1}
.leash{stroke:var(--amber);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.tgt{stroke:var(--amber);stroke-width:1.5;fill:none}
.act{fill:var(--teal)}
.act-halo{fill:none;stroke:var(--teal);stroke-width:1;opacity:.35}
.padtags{
  display:flex;justify-content:space-between;
  margin-top:7px;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.padtags em{font-style:normal;color:var(--text)}
.padtags i{font-style:normal;color:var(--teal)}
.hint{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--dim)}

.seg{display:flex;margin-bottom:10px;border:1px solid var(--lineHi)}
.seg button{
  flex:1;border:none;background:transparent;padding:7px 6px;
  border-right:1px solid var(--lineHi);
}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:#1b2540;color:var(--amber)}
.seg button:hover:not([aria-pressed=true]){background:#161f36;color:var(--text)}

.stick{stroke:var(--amber);stroke-width:2;opacity:.85}
.knob{fill:var(--amber)}
.ring{fill:none;stroke:var(--line);stroke-width:1}
.jsOnly{display:none}
.pad.joy .jsOnly{display:inline}
.pad.joy .tgt,.pad.joy .leash{display:none}

.field{display:flex;align-items:center;gap:10px;margin-top:9px}
.field .lbl{width:70px;flex:none}
select,input[type=range]{
  flex:1;
  background:var(--panel2);
  border:1px solid var(--lineHi);
  color:var(--text);
  font-family:var(--mono);
  font-size:12px;
  padding:6px 8px;
}
input[type=range]{padding:0;height:22px;accent-color:var(--amber);border:none;background:none}
select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.val{width:34px;text-align:right;color:var(--teal);font-variant-numeric:tabular-nums}

.tel{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.tel div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tel span{color:var(--text);font-variant-numeric:tabular-nums}

.log{height:132px;overflow-y:auto;padding:8px 18px;font-size:11.5px;line-height:1.65}
.log p{margin:0;white-space:pre-wrap;word-break:break-word}
.log .t{color:#3d4a66}
.log .g{color:var(--dim)}
.I .g{color:var(--green)}
.W .g{color:var(--amber)}
.E .g{color:var(--red)}
.W p,.E p{color:#e4ebf7}

@media (max-width:820px){
  .body{grid-template-columns:1fr;grid-template-rows:minmax(220px,45vh) auto}
  .side{max-height:none}
  .dots{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="shell">

  <header class="bar">
    <div class="brand">CamNode<span>·01</span></div>

    <div class="ribbon" title="Node state and approx. current draw">
      <div class="state" id="stateName">UNKNOWN</div>
      <div class="gauge"><i id="gaugeFill"></i></div>
      <div class="draw" id="draw">— mA</div>
    </div>

    <div class="dots">
      <div class="dot" id="dotCam"><b></b><span class="lbl">Camera</span></div>
      <div class="dot" id="dotWs"><b></b><span class="lbl">Bridge</span></div>
    </div>
  </header>

  <div class="body">

    <section class="stage">
      <div class="screen idle" id="screen">
        <img id="video" alt="Camera stream">
        <div class="void">
          <b>No frames</b>
          Press Start to begin streaming
        </div>
      </div>
      <div class="strip">
        <div class="stat"><b id="sFps">—</b><div class="lbl">fps</div></div>
        <div class="stat"><b id="sSize">—</b><div class="lbl">frame size</div></div>
        <div class="stat"><b id="sRate">—</b><div class="lbl">bitrate</div></div>
        <div class="stat"><b id="sCount">—</b><div class="lbl">frames</div></div>
        <div class="stat"><b id="sView">—</b><div class="lbl">viewers</div></div>
      </div>
    </section>

    <aside class="side">

      <div class="sec">
        <span class="lbl">Stream</span>
        <div class="row">
          <button class="go"   id="bStart">Start</button>
          <button class="halt" id="bStop">Stop</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="bStatus">Get status</button>
        </div>
      </div>

      <div class="sec">
        <span class="lbl">Aiming</span>
        <div class="seg" role="group" aria-label="Control mode">
          <button id="mAim" aria-pressed="true">Aim</button>
          <button id="mJoy" aria-pressed="false">Joystick</button>
        </div>
        <div class="pad" id="pad" tabindex="0" role="application"
             aria-label="Aim pad: horizontal is pan, vertical is tilt">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <line class="axes" x1="50" y1="0"  x2="50"  y2="100"/>
            <line class="axes" x1="0"  y1="50" x2="100" y2="50"/>
            <line class="leash" id="leash" x1="50" y1="50" x2="50" y2="50"/>
            <g id="tgt" class="tgt">
              <circle cx="50" cy="50" r="4.5"/>
              <line x1="50" y1="42" x2="50" y2="47"/>
              <line x1="50" y1="53" x2="50" y2="58"/>
              <line x1="42" y1="50" x2="47" y2="50"/>
              <line x1="53" y1="50" x2="58" y2="50"/>
            </g>
            <circle class="ring jsOnly" cx="50" cy="50" r="34"/>
            <line   class="stick jsOnly" id="stick" x1="50" y1="50" x2="50" y2="50"/>
            <circle class="knob jsOnly"  id="knob"  cx="50" cy="50" r="4"/>
            <circle class="act-halo" id="halo" cx="50" cy="50" r="6"/>
            <circle class="act"      id="act"  cx="50" cy="50" r="2.6"/>
          </svg>
        </div>
        <div class="padtags">
          <div>pan <em id="tPan">90</em>° → <i id="aPan">90</i>°</div>
          <div>tilt <em id="tTilt">90</em>° → <i id="aTilt">90</i>°</div>
        </div>
        <div class="row" style="margin-top:9px">
          <button id="bCenter">Center</button>
        </div>
        <p class="hint" id="hint">Click or drag to move the camera to that point.</p>
      </div>

      <div class="sec">
        <span class="lbl">Image</span>
        <div class="field">
          <span class="lbl">Size</span>
          <select id="res">
            <option value="0">QVGA 320×240</option>
            <option value="1">VGA 640×480</option>
            <option value="2" selected>SVGA 800×600</option>
            <option value="3">XGA 1024×768</option>
          </select>
        </div>
        <div class="field">
          <span class="lbl">Quality</span>
          <input type="range" id="q" min="10" max="30" value="12">
          <span class="val" id="qv">12</span>
        </div>
        <div class="row" style="margin-top:9px">
          <button id="bApply">Apply</button>
        </div>
      </div>

      <div class="sec">
        <span class="lbl">Telemetry</span>
        <div class="tel">
          <div><span class="lbl">Battery</span><span id="vBat">—</span></div>
          <div><span class="lbl">Solar</span><span id="vSol">—</span></div>
          <div><span class="lbl">PIR</span><span id="vPir">—</span></div>
          <div><span class="lbl">RSSI</span><span id="vRssi">—</span></div>
          <div><span class="lbl">Uptime</span><span id="vUp">—</span></div>
          <div><span class="lbl">State</span><span id="vSt">—</span></div>
        </div>
      </div>

    </aside>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
'use strict';

// Servo limits, must match BLE_protocol.h
const PAN_MIN = 0,  PAN_MAX  = 180;
const TILT_MIN = 30, TILT_MAX = 150;

// state -> label and approx. current draw
const STATES = [
  { n:'Sleep',      mA:2.5,  c:'var(--green)' },
  { n:'Waking',     mA:150,  c:'var(--amber)' },
  { n:'Streaming',  mA:255,  c:'var(--amber)' },
  { n:'Shutdown',   mA:50,   c:'var(--amber)' },
  { n:'Fault',      mA:2.5,  c:'var(--red)'   },
];

const $ = (id) => document.getElementById(id);

let ws = null;
let target = { pan:90, tilt:90 };
let actual = { pan:90, tilt:90 };
let sendGate = 0;

function connect(){
  if (!location.host){
    addLog('E','PANEL','Open this page via the bridge: http://<VPS>:8080');
    return;
  }
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${scheme}://${location.host}`);

  ws.onopen = () => {
    $('dotWs').classList.add('on');
    addLog('I','PANEL','Bridge connected');
  };

  ws.onclose = () => {
    $('dotWs').classList.remove('on');
    setCamera(false);
    addLog('W','PANEL','Bridge lost, retrying in 2 s');
    setTimeout(connect, 2000);
  };

  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'hello'){
      setCamera(m.camera);
      if (m.telemetry) applyTelemetry(m.telemetry);
      if (m.stat) applyStat(m.stat, 0);
    } else if (m.type === 'link'){
      setCamera(m.camera);
    } else if (m.type === 'telemetry'){
      applyTelemetry(m.data);
    } else if (m.type === 'stat'){
      applyStat(m.stat, m.viewers);
    } else if (m.type === 'log'){
      addLog(m.line.level, m.line.tag, m.line.text);
    }
  };
}

function send(obj){
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function setCamera(on){
  $('dotCam').classList.toggle('on', on);
  ['bStart','bStop','bStatus','bApply','bCenter'].forEach(id => $(id).disabled = !on);
  if (!on){
    $('screen').classList.add('idle');
    $('video').removeAttribute('src');
  }
}

function applyStat(s, viewers){
  const live = s.fps > 0;
  $('sFps').textContent   = live ? s.fps.toFixed(1) : '—';
  $('sSize').textContent  = live ? s.avgKB.toFixed(1) + ' KB' : '—';
  $('sRate').textContent  = live ? s.mbit.toFixed(2) + ' Mbit/s' : '—';
  $('sCount').textContent = s.frames || '—';
  $('sView').textContent  = viewers ?? '—';
}

function applyTelemetry(t){
  $('vBat').textContent  = (t.battery_mv/1000).toFixed(2) + ' V';
  $('vSol').textContent  = (t.solar_mv/1000).toFixed(2) + ' V';
  $('vPir').textContent  = t.pir_count;
  $('vRssi').textContent = t.rssi + ' dBm';

  const h = Math.floor(t.uptime_s/3600), m = Math.floor(t.uptime_s%3600/60);
  $('vUp').textContent = h ? `${h} h ${m} min` : `${m} min`;

  const st = STATES[t.state] || { n:'?', mA:0, c:'var(--dim)' };
  $('vSt').textContent = st.n;
  $('stateName').textContent = st.n.toUpperCase();
  $('stateName').style.color = st.c;
  // log scale, 1..300 mA
  const pct = Math.max(0, Math.min(100,
    Math.log10(Math.max(st.mA,1)) / Math.log10(300) * 100));
  $('gaugeFill').style.right = (100 - pct) + '%';
  $('draw').textContent = st.mA < 10
      ? st.mA.toFixed(1) + ' mA'
      : Math.round(st.mA) + ' mA';

  actual = { pan:t.pan, tilt:t.tilt };
  drawPad();
}

function toXY(p){
  return {
    x: (p.pan - PAN_MIN) / (PAN_MAX - PAN_MIN) * 100,
    y: 100 - (p.tilt - TILT_MIN) / (TILT_MAX - TILT_MIN) * 100,
  };
}

function drawPad(){
  const t = toXY(target), a = toXY(actual);
  $('tgt').setAttribute('transform', `translate(${t.x-50},${t.y-50})`);
  $('act').setAttribute('cx', a.x);  $('act').setAttribute('cy', a.y);
  $('halo').setAttribute('cx', a.x); $('halo').setAttribute('cy', a.y);
  const l = $('leash');
  l.setAttribute('x1', t.x); l.setAttribute('y1', t.y);
  l.setAttribute('x2', a.x); l.setAttribute('y2', a.y);

  $('tPan').textContent  = Math.round(target.pan);
  $('tTilt').textContent = Math.round(target.tilt);
  $('aPan').textContent  = Math.round(actual.pan);
  $('aTilt').textContent = Math.round(actual.tilt);
}

function aim(pan, tilt, force){
  target.pan  = Math.max(PAN_MIN,  Math.min(PAN_MAX,  Math.round(pan)));
  target.tilt = Math.max(TILT_MIN, Math.min(TILT_MAX, Math.round(tilt)));
  drawPad();

  const now = Date.now();
  if (!force && now - sendGate < 120) return;   // throttle
  sendGate = now;
  send({ cmd:'move', pan:target.pan, tilt:target.tilt });
}

const pad = $('pad');
let joy = false;          // false = aim, true = joystick
let dragging = false;
let velTimer = null;
let vel = { vx:0, vy:0 };

function setMode(isJoy){
  joy = isJoy;
  pad.classList.toggle('joy', joy);
  $('mAim').setAttribute('aria-pressed', String(!joy));
  $('mJoy').setAttribute('aria-pressed', String(joy));
  $('hint').textContent = joy
    ? 'Hold and drag from the center, the camera moves while held.'
    : 'Click or drag to move the camera to that point.';
  stopVel();
  drawStick(0, 0);
}

$('mAim').onclick = () => setMode(false);
$('mJoy').onclick = () => setMode(true);

function drawStick(vx, vy){
  const x = 50 + vx * 0.34;          // ring radius = 34
  const y = 50 - vy * 0.34;
  $('stick').setAttribute('x2', x);
  $('stick').setAttribute('y2', y);
  $('knob').setAttribute('cx', x);
  $('knob').setAttribute('cy', y);
}

function startVel(){
  if (velTimer) return;
  // repeat faster than node's 500 ms watchdog
  velTimer = setInterval(() => send({ cmd:'vel', vx:vel.vx, vy:vel.vy }), 150);
  send({ cmd:'vel', vx:vel.vx, vy:vel.vy });
}

function stopVel(){
  if (velTimer){ clearInterval(velTimer); velTimer = null; }
  if (vel.vx || vel.vy) send({ cmd:'vel', vx:0, vy:0 });
  vel = { vx:0, vy:0 };
  drawStick(0, 0);
}

function padPoint(e){
  const r = pad.getBoundingClientRect();
  const nx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const ny = Math.max(0, Math.min(1, (e.clientY - r.top)  / r.height));

  if (joy){
    let vx = Math.round((nx - 0.5) * 200);
    let vy = Math.round((0.5 - ny) * 200);
    if (Math.abs(vx) < 12) vx = 0;          // deadband
    if (Math.abs(vy) < 12) vy = 0;
    vel = { vx:Math.max(-100,Math.min(100,vx)),
            vy:Math.max(-100,Math.min(100,vy)) };
    drawStick(vel.vx, vel.vy);
    startVel();
  } else {
    aim(PAN_MIN + nx * (PAN_MAX - PAN_MIN),
        TILT_MAX - ny * (TILT_MAX - TILT_MIN), false);
  }
}

pad.addEventListener('pointerdown', (e) => {
  dragging = true; pad.setPointerCapture(e.pointerId); padPoint(e);
});
pad.addEventListener('pointermove', (e) => { if (dragging) padPoint(e); });
pad.addEventListener('pointerup', () => {
  dragging = false;
  if (joy) stopVel();
  else     aim(target.pan, target.tilt, true);
});
pad.addEventListener('pointercancel', () => { dragging = false; stopVel(); });
pad.addEventListener('lostpointercapture', () => { dragging = false; if (joy) stopVel(); });

pad.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 10 : 2;
  const map = { ArrowLeft:[-step,0], ArrowRight:[step,0],
                ArrowUp:[0,step],    ArrowDown:[0,-step] };
  if (!map[e.key]) return;
  e.preventDefault();
  aim(target.pan + map[e.key][0], target.tilt + map[e.key][1], true);
});

$('bStart').onclick = () => {
  send({ cmd:'start' });
  addLog('I','PANEL','Command: start stream');
  setTimeout(() => {
    $('video').src = '/stream?t=' + Date.now();
    $('screen').classList.remove('idle');
  }, 900);
};

$('bStop').onclick = () => {
  stopVel();
  send({ cmd:'stop' });
  addLog('I','PANEL','Command: stop stream');
  $('video').removeAttribute('src');
  $('screen').classList.add('idle');
};

$('bStatus').onclick  = () => send({ cmd:'status' });
$('bCenter').onclick  = () => { stopVel(); send({ cmd:'home' }); };
$('bApply').onclick   = () => {
  send({ cmd:'params', resolution:+$('res').value, quality:+$('q').value });
  addLog('I','PANEL',`Params: ${$('res').selectedOptions[0].text}, quality ${$('q').value}`);
};
$('q').oninput = (e) => $('qv').textContent = e.target.value;

$('video').onerror = () => {
  $('screen').classList.add('idle');
  addLog('W','PANEL','Stream interrupted');
};

function addLog(level, tag, text){
  const box = $('log');
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
  const p = document.createElement('p');
  p.className = level;
  const ts = new Date().toTimeString().slice(0,8);
  p.innerHTML = `<span class="t">${ts}</span> <span class="g">${level}</span> ${tag}: ${text}`;
  box.appendChild(p);
  while (box.childElementCount > 300) box.removeChild(box.firstChild);
  if (stick) box.scrollTop = box.scrollHeight;
}

setCamera(false);
drawPad();
connect();
</script>
</body>
</html>
