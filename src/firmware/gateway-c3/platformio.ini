[platformio]
default_envs = gateway-c3

[env:gateway-c3]
platform = espressif32@^6.9.0
board = lolin-c3-mini
framework = espidf

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, colorize

lib_extra_dirs = ../shared

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11